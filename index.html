<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ProteinCheck">
<meta name="theme-color" content="#0A2A4A">
<title>ProteinCheck</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:#0A2A4A;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:#F4F8FB;min-height:100vh}
input,select,button{font-family:inherit}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}

/* ── LAYOUT ── */
#app{min-height:100vh;background:#F4F8FB;color:#1E1E1E}
.header{background:#0A2A4A;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:19px;font-weight:700;color:#fff;display:flex;align-items:center;gap:9px}
.header-sub{font-size:11px;color:#5DADE2;margin-top:1px;letter-spacing:.3px}
.stats-bar{background:#0A2A4A;display:flex;border-top:1px solid rgba(255,255,255,.1)}
.stat{flex:1;padding:8px 4px;text-align:center;border-right:1px solid rgba(255,255,255,.1)}
.stat:last-child{border-right:none}
.stat-num{font-size:13px;font-weight:700;color:#5DADE2;line-height:1.2}
.stat-num.small{font-size:9px}
.stat-lbl{font-size:9px;color:rgba(255,255,255,.6);margin-top:1px}
.filter-bar{display:flex;gap:7px;padding:11px 13px;background:#fff;border-bottom:1px solid #C8DCE8;flex-wrap:wrap;align-items:center}
.filter-btn{padding:5px 11px;border-radius:20px;border:1.5px solid #C8DCE8;background:#F4F8FB;color:#5D7A8A;font-size:11px;font-weight:500;cursor:pointer}
.filter-btn.active{background:#0A2A4A;border-color:#0A2A4A;color:#fff}
#search-input{margin-left:auto;padding:6px 11px;border:1.5px solid #C8DCE8;border-radius:20px;font-size:12px;background:#F4F8FB;outline:none;width:130px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;padding:14px 14px 100px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(26,77,46,.10);border:1px solid #C8DCE8;cursor:pointer;display:flex;flex-direction:column}
.card-img{width:100%;height:145px;object-fit:cover}
.card-emoji{width:100%;height:145px;display:flex;align-items:center;justify-content:center;font-size:42px;background:#EBF5FB}
.card-bar{height:3px}
.card-body{padding:10px;flex:1;display:flex;flex-direction:column;gap:4px}
.card-cat{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#5D7A8A}
.card-name{font-size:14px;font-weight:700;color:#0A2A4A;line-height:1.2}
.card-prot{display:inline-flex;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;width:fit-content;margin-top:2px}
.card-macros{display:flex;gap:4px;margin-top:3px}
.macro-box{flex:1;background:#EBF5FB;border-radius:5px;padding:3px 4px;text-align:center}
.macro-lbl{font-size:8px;color:#5D7A8A}
.macro-val{font-size:10px;font-weight:700}
.card-use{font-size:10px;color:#1A5276;font-weight:500;margin-top:2px}
.e-badges{display:flex;gap:4px;margin-top:4px}
.e-badge{font-size:9px;font-weight:700;color:#fff;border-radius:10px;padding:1px 7px}
.add-card{background:#EAF4FB;border:2px dashed #5DADE2;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:260px;cursor:pointer;color:#1A5276;font-size:13px;font-weight:600}

/* ── OVERLAYS ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.overlay.bottom{align-items:flex-end;padding:0 0 env(safe-area-inset-bottom)}
.panel{background:#fff;border-radius:16px;width:100%;max-width:440px;max-height:92vh;overflow-y:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.panel-bottom{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:82vh;overflow-y:auto;padding:24px;box-shadow:0 -8px 40px rgba(0,0,0,.2)}
.panel-title{font-size:18px;font-weight:700;color:#0A2A4A;margin-bottom:4px}
.panel-sub{font-size:12px;color:#5D7A8A;margin-bottom:16px}

/* ── FORM ── */
.field{margin-bottom:10px}
.field-label{font-size:10px;font-weight:600;color:#5D7A8A;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.inp{width:100%;padding:8px 10px;border:1.5px solid #C8DCE8;border-radius:7px;font-size:13px;background:#F4F8FB;outline:none}
.inp:focus{border-color:#5DADE2}
.inp-sm{padding:7px 8px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.section-box{background:#EBF5FB;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.section-title{font-size:11px;font-weight:700;color:#0A2A4A;margin-bottom:8px}

/* ── BUTTONS ── */
.btn{padding:10px 16px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}
.btn-primary{background:#0A2A4A;color:#fff;width:100%}
.btn-primary:disabled{background:#ccc;cursor:default}
.btn-secondary{background:#EBF5FB;color:#5D7A8A}
.btn-mint{background:#EAF4FB;color:#0A2A4A;border:1.5px solid #5DADE2}
.btn-danger{background:#fff0ee;color:#c0392b;border:1.5px solid #fad7d2}
.btn-group{display:flex;gap:8px;margin-top:16px}
.goal-btn{flex:1;padding:9px 4px;border-radius:8px;border:2px solid #C8DCE8;background:#F4F8FB;color:#5D7A8A;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.goal-btn.active{border-color:#0A2A4A;background:#EAF4FB;color:#0A2A4A}
.meal-btn{flex:1;padding:9px 4px;border-radius:8px;border:2px solid #C8DCE8;background:#F4F8FB;color:#5D7A8A;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.meal-btn.active{border-color:#0A2A4A;background:#EAF4FB;color:#0A2A4A}

/* ── DETAIL ── */
.detail-hero{width:100%;height:190px;object-fit:cover;border-radius:10px;cursor:zoom-in;display:block;margin-bottom:12px}
.detail-cat{font-size:10px;font-weight:600;color:#5D7A8A;text-transform:uppercase;letter-spacing:1px}
.detail-name{font-size:18px;font-weight:700;color:#0A2A4A;margin:5px 0 10px}
.detail-prot-badge{display:inline-flex;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:12px}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.macro-cell{background:#EBF5FB;border-radius:7px;padding:8px 4px;text-align:center}
.macro-cell-val{font-size:15px;font-weight:700}
.macro-cell-lbl{font-size:9px;color:#5D7A8A;margin-top:2px}
.advice-box{background:#EAF4FB;border:1px solid #5DADE2;border-radius:9px;padding:11px 13px;margin-bottom:12px}
.advice-title{font-size:11px;font-weight:700;color:#0A2A4A;margin-bottom:8px}
.advice-line{font-size:12px;color:#1A3A5A;line-height:1.6;padding:3px 6px;margin-bottom:2px;border-radius:5px}
.advice-warn{background:#fff5f5}
.advice-good{background:#f0faf4}
.e-block{border-radius:9px;padding:11px 13px;margin-bottom:12px}
.e-row{display:flex;align-items:flex-start;gap:7px;margin-bottom:4px}
.e-dot{width:9px;height:9px;border-radius:50%;margin-top:3px;flex-shrink:0}
.e-name{font-size:12px}
.e-desc{font-size:11px;color:#5D7A8A;line-height:1.4}

/* ── PHOTO SLOTS ── */
.photo-slots{display:flex;gap:10px;margin-bottom:14px}
.photo-slot{flex:1;display:flex;flex-direction:column;gap:6px}
.photo-slot-label{font-size:10px;font-weight:700;color:#0A2A4A;text-transform:uppercase;letter-spacing:.5px}
.photo-preview{width:100%;height:130px;object-fit:cover;border-radius:8px;border:2px solid #5DADE2;display:block}
.photo-hint{border:2px dashed #5DADE2;border-radius:8px;height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#EAF4FB;color:#1A5276;cursor:pointer}
.photo-hint-icon{font-size:24px}
.photo-hint-text{font-size:11px;font-weight:600}
.photo-hint-sub{font-size:10px;color:#5D7A8A;text-align:center;padding:0 8px}
.photo-change{text-align:center;margin-top:4px;font-size:10px;color:#5D7A8A}

/* ── FLOATING BUTTON ── */
.fab{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));right:16px;z-index:300;background:#0A2A4A;color:#fff;border:none;border-radius:50%;width:52px;height:52px;font-size:24px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(10,42,74,.4);transition:transform 0.2s,opacity 0.2s;touch-action:pan-y}
.fab.hidden{transform:translateX(72px);opacity:0;pointer-events:none}

/* ── SNACK PANEL ── */
.snack-timeslot{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.snack-timeslot-label{font-size:11px;font-weight:600;color:#5D7A8A;text-transform:uppercase;letter-spacing:1px}
.snack-close{background:none;border:none;font-size:20px;cursor:pointer;color:#5D7A8A;line-height:1}
.snack-title{font-size:18px;font-weight:700;color:#0A2A4A;margin-bottom:16px}
.snack-card{background:#EAF4FB;border:1.5px solid #5DADE2;border-radius:14px;overflow:hidden;margin-bottom:16px}
.snack-card-img{width:100%;height:160px;object-fit:cover;display:block}
.snack-card-body{padding:14px 16px}
.snack-card-cat{font-size:10px;font-weight:600;color:#5D7A8A;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.snack-card-name{font-size:20px;font-weight:700;color:#0A2A4A;margin-bottom:2px}
.snack-card-brand{font-size:12px;color:#5D7A8A;margin-bottom:10px}
.snack-portie{background:#0A2A4A;border-radius:10px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.snack-portie-gram{font-size:36px;font-weight:900;color:#fff;line-height:1}
.snack-portie-prot{font-size:13px;color:#5DADE2;font-weight:700}
.snack-portie-kcal{font-size:12px;color:rgba(255,255,255,.7)}
.snack-portie-budget{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px}
.snack-reason{font-size:12px;color:#0A2A4A;line-height:1.6;background:rgba(255,255,255,.7);border-radius:8px;padding:9px 11px}
.alt-title{font-size:11px;font-weight:600;color:#5D7A8A;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.alt-item{background:#EBF5FB;border:1px solid #C8DCE8;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:6px}
.alt-img{width:44px;height:44px;object-fit:cover;border-radius:8px;flex-shrink:0}
.alt-emoji{width:44px;height:44px;background:#EAF4FB;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.alt-name{font-size:13px;font-weight:700;color:#0A2A4A}
.alt-sub{font-size:11px;color:#5D7A8A}

/* ── LIGHTBOX ── */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px;cursor:pointer}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain}
.lightbox-close{position:absolute;top:20px;right:20px;color:#fff;font-size:28px;line-height:1}

/* ── BARCODE ── */
.barcode-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#barcode-reader{width:100%;max-width:340px;border-radius:12px;overflow:hidden;background:#000}
#barcode-reader video{border-radius:12px}
.barcode-status{color:#fff;font-size:13px;margin-top:16px;text-align:center;max-width:320px;line-height:1.5}

/* ── MISC ── */
.summary-box{background:#EAF4FB;border-radius:8px;padding:10px 12px;font-size:12px;color:#0A2A4A;line-height:1.7;margin-top:10px}
.backup-msg{font-size:11px;margin-top:10px;line-height:1.5}
.save-err{background:#fff0ee;color:#c0392b;padding:8px 14px;font-size:12px}
.hint{font-size:10px;color:#5D7A8A;margin-top:6px;line-height:1.5}
.scan-ok{background:#EAF4FB;border:1px solid #5DADE2;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:#0A2A4A}
.scan-err{background:#fff0ee;border:1px solid #fad7d2;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:#c0392b}
.e-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.e-tag{display:flex;align-items:center;gap:4px;border-radius:6px;padding:3px 7px;font-size:11px;border:1px solid}
.e-tag-dot{width:7px;height:7px;border-radius:50%}
.divider{margin-top:20px;padding-top:16px;border-top:1px solid #C8DCE8}
</style>
</head>

<script>

// STORAGE
// ══════════════════════════════════════════════════════════════════
const storage = {
  get(key){ try{ const v=localStorage.getItem(key); return v!==null?{value:v}:null; }catch(e){ return null; } },
  set(key,value){ try{ localStorage.setItem(key,value); return true; }catch(e){ return false; } }
};

// ══════════════════════════════════════════════════════════════════

function parseENumbers(str){
  if(!str) return [];
  const matches=(str.toUpperCase().match(/E\s?\d{3}[A-Z]?/g)||[]).map(function(m){return m.replace(/\s/g,"");});
  const seen={};
  return matches.filter(function(c){ return seen[c]?false:(seen[c]=true); }).map(function(code){
    const info=E_NUMBERS[code];
    return info?{code:code,name:info[0],rating:info[1],desc:info[2]}:{code:code,name:"Onbekend",rating:"unknown",desc:"Niet in database"};
  });
}
function eColor(r){ return r==="green"?"#2E8B57":r==="yellow"?"#D4A017":r==="red"?"#C0392B":"#999"; }
function eLabel(r){ return r==="green"?"Veilig":r==="yellow"?"Matig":r==="red"?"Vermijden":"Onbekend"; }
function protColor(p){ return p>=15?"#0A2A4A":p>=7?"#1A5276":p>0?"#5D8AA8":"#aaa"; }

// ══════════════════════════════════════════════════════════════════
// DOELEN
// ══════════════════════════════════════════════════════════════════

  proteinMin:130, proteinMax:140, proteinActive:150,
  goal:"afvallen", mealsPerDay:4,

// ══════════════════════════════════════════════════════════════════
function generateAdvice(product, goals){
  var lines=[];
  var p=parseFloat(product.protein)||0;
  var fat=parseFloat(product.fat)||0;
  var sugar=parseFloat(product.sugar)||0;
  var kcal=parseFloat(product.kcal)||0;
  var carb=parseFloat(product.carb)||0;
  var cat=product.cat||"overig";
  var actFactor=goals.activityLevel==="hoog"?1.3:goals.activityLevel==="matig"?1.15:1.0;
  var baseProtein=goals.goal==="spiermassa"?goals.proteinActive:goals.goal==="onderhoud"?goals.proteinMin:(goals.proteinMin+goals.proteinMax)/2;
  var effectiveProtein=Math.round(baseProtein*actFactor);
  var proteinPerMeal=Math.round(effectiveProtein/goals.mealsPerDay);
  var kcalPerMeal=Math.round(goals.kcalTarget/goals.mealsPerDay);
  var carbPerMeal=Math.round(goals.carbTarget/goals.mealsPerDay);
  if(p>=20) lines.push("✅ Topeiwitbron ("+p+"g/100g) — uitstekend voor jouw doel.");
  else if(p>=15) lines.push("✅ Uitstekende eiwitbron ("+p+"g/100g).");
  else if(p>=7) lines.push("👍 Goede eiwitbron ("+p+"g/100g).");
  else if(p>=3) lines.push("⚠️ Matige eiwitbron ("+p+"g/100g) — combineer met iets eiwitrijkers.");
  else lines.push("❌ Weinig eiwit ("+p+"g/100g) — vul aan met een eiwitrijker product.");
  if(p>0){
    var portie=Math.round((proteinPerMeal/p)*100);
    if(portie>=30&&portie<=700){
      lines.push("📏 Aanbevolen portie: ~"+portie+"g → levert "+proteinPerMeal+"g eiwit (doel "+effectiveProtein+"g/dag ÷ "+goals.mealsPerDay+" maaltijden).");
      if(kcal>0){
        var portieKcal=Math.round((portie/100)*kcal);
        var pct=Math.round((portieKcal/kcalPerMeal)*100);
        lines.push("🔥 Die portie levert ~"+portieKcal+" kcal ("+pct+"% van je maaltijdbudget van "+kcalPerMeal+" kcal).");
      }
    }
  }
  if(fat>30) lines.push("⚠️ Hoog vetgehalte ("+fat+"g/100g) — gebruik kleine porties; dagdoel is "+goals.fatTarget+"g vet.");
  else if(fat>20&&goals.goal==="afvallen") lines.push("🟡 Redelijk vetgehalte ("+fat+"g/100g) — let op portiegrootte bij afvallen.");
  if(sugar>15) lines.push("🍬 Hoog suikergehalte ("+sugar+"g/100g) — beperkt gebruiken.");
  else if(sugar>8&&goals.goal==="afvallen") lines.push("🟡 Matig suikergehalte ("+sugar+"g/100g) — let op frequentie.");
  var timing={zuivel:"🕐 Goed als ontbijt of tussendoor snack.",eiwit:p>=15?"🍽️ Ideaal als hoofdgerecht of na het sporten.":"🍽️ Goed als onderdeel van een maaltijd.",broodbeleg:fat>20?"🥪 Gebruik als topping in kleine hoeveelheid.":"🥪 Prima als broodbeleg.",groenten:"🥦 Caloriearm en voedzaam — combineer met een eiwitbron.",granen:"🌾 Combineer altijd met een eiwitbron (doel "+carbPerMeal+"g koolh./maaltijd).",overig:""};
  if(timing[cat]) lines.push(timing[cat]);
  var verschil=goals.weight-goals.targetWeight;
  if(goals.goal==="afvallen"&&verschil>0){
    var past=p>=7&&fat<=20&&sugar<=10;
    if(verschil>15) lines.push("🎯 Nog "+verschil+"kg naar doelgewicht ("+goals.targetWeight+"kg) — "+(past?"dit product past goed in je plan.":"kies vaker producten met meer eiwit en minder vet."));
    else if(verschil>=5) lines.push("🎯 Nog "+verschil+"kg naar doel — "+(past?"past prima in de afvalfase.":"let op vet- en suikergehalte."));
    else if(verschil>0) lines.push("🎯 Bijna op doelgewicht ("+verschil+"kg te gaan) — focus op handhaven en voldoende eiwit.");
  } else if(goals.goal==="spiermassa"){
    lines.push(p>=15?"💪 Goede keuze voor spiermassa-opbouw.":"💪 Voor spiermassa: combineer met een product van >15g eiwit/100g.");
  } else if(goals.goal==="onderhoud"){
    lines.push("⚖️ Voor onderhoud: zorg dat je dagelijkse totaal rond "+effectiveProtein+"g eiwit blijft.");
  }
  if(goals.activityLevel==="hoog"&&p<10) lines.push("🏃 Bij intensief sporten heb je extra eiwit nodig — kies vaker producten boven 15g/100g.");
  else if(goals.activityLevel==="laag"&&p>=15) lines.push("🪑 Bij een laag activiteitsniveau is dit een efficiënte eiwitkeuze.");
  return lines;
}

var EXTRAS = [
  {name:"een handvol aardbeien",      kcal:32,  prot:0.7, cat:"fruit",    slots:["ontbijt","ochtendsnack","middagsnack"]},

function generateSnack(products, goals){
  if(!products.length) return {error:"Voeg eerst producten toe aan je catalogus."};
  var hour=new Date().getHours();
  var slot=hour>=6&&hour<10?"ontbijt":hour>=10&&hour<12?"ochtendsnack":hour>=12&&hour<14?"lunch":hour>=14&&hour<17?"middagsnack":hour>=17&&hour<20?"avondeten":hour>=20&&hour<23?"avondsnack":"nachtsnack";

  // Categorie voorkeur per tijdslot
  var catPref={
    ontbijt:["zuivel","granen","eiwit"],
    ochtendsnack:["zuivel","eiwit","groenten"],
    lunch:["eiwit","groenten","granen","broodbeleg"],
    middagsnack:["zuivel","eiwit","groenten"],
    avondeten:["eiwit","groenten","granen"],
    avondsnack:["zuivel","eiwit"],
    nachtsnack:["zuivel","eiwit"]
  }[slot]||["eiwit","zuivel"];

  // Macrobudget berekenen
  var mealsElapsed=Math.min(goals.mealsPerDay,hour<8?0:hour<12?1:hour<15?2:hour<19?3:goals.mealsPerDay-1);
  var mealsLeft=Math.max(1,goals.mealsPerDay-mealsElapsed);
  var actFactor=goals.activityLevel==="hoog"?1.3:goals.activityLevel==="matig"?1.15:1.0;
  var effectiveProtein=Math.round(((goals.proteinMin+goals.proteinMax)/2)*actFactor);
  var snackProteinTarget=Math.round((effectiveProtein*(mealsLeft/goals.mealsPerDay))/Math.max(1,mealsLeft));
  var snackKcalBudget=Math.round((goals.kcalTarget*(mealsLeft/goals.mealsPerDay))/Math.max(1,mealsLeft));

  // Score producten uit catalogus
  var RED_E=["E102","E104","E110","E122","E124","E127","E129","E131","E133","E171","E220","E221","E249","E250","E251","E252","E320","E321","E621","E622","E627","E631","E951","E952"];
  var scored=products.map(function(p){
    var prot=parseFloat(p.protein)||0, fat=parseFloat(p.fat)||0, sugar=parseFloat(p.sugar)||0, kcal=parseFloat(p.kcal)||0;
    var score=0;
    var catRank=catPref.indexOf(p.cat);
    if(catRank===0) score+=40; else if(catRank===1) score+=25; else if(catRank===2) score+=10;
    if(prot>=20) score+=35; else if(prot>=15) score+=25; else if(prot>=7) score+=12; else if(prot>=3) score+=4;
    if(goals.goal==="afvallen"){ if(fat>25) score-=20; if(sugar>12) score-=15; if(kcal>0&&kcal<200) score+=10; }
    else if(goals.goal==="spiermassa"){ if(prot>=15) score+=15; if(kcal>200) score+=5; }
    var ens=(p.enumbers||"").toUpperCase().match(/E\s?\d{3}[A-Z]?/g)||[];
    score-=ens.filter(function(e){ return RED_E.indexOf(e.replace(/\s/g,""))>=0; }).length*8;
    if((slot==="avondsnack"||slot==="nachtsnack")&&kcal>300) score-=10;
    return Object.assign({},p,{_score:score});
  });
  scored.sort(function(a,b){ return b._score-a._score; });
  var top=scored.slice(0,Math.min(3,scored.length));
  var pick=top[Math.floor(Math.random()*top.length)];

  // Portie berekenen voor basis
  var prot=parseFloat(pick.protein)||0;
  var portie=prot>0?Math.round((snackProteinTarget/prot)*100):150;
  portie=Math.max(50,Math.min(400,portie));
  var portieKcal=pick.kcal>0?Math.round((portie/100)*pick.kcal):0;
  var portieProt=prot>0?Math.round((portie/100)*prot):0;

  // Kies een passende aanvulling
  var extraPool=EXTRAS.filter(function(e){ return e.slots.indexOf(slot)>=0; });
  // Stuur aan op kcal resterende ruimte
  var kcalLeft=snackKcalBudget-portieKcal;
  if(goals.goal==="afvallen"&&kcalLeft<50) extraPool=extraPool.filter(function(e){ return e.kcal<50; });
  else if(goals.goal==="spiermassa")       extraPool=extraPool.filter(function(e){ return e.prot>1; });

  // Kies extra passend bij categorie basis
  var extra=null;
  if(extraPool.length){
    // Vermijd zoet bij avond
    if(slot==="avondsnack"||slot==="nachtsnack") extraPool=extraPool.filter(function(e){ return e.cat!=="zoet"; })||extraPool;
    // Combineer zuivel graag met fruit of zaad
    if(pick.cat==="zuivel"||pick.cat==="eiwit"){
      var fruity=extraPool.filter(function(e){ return e.cat==="fruit"||e.cat==="zaad"; });
      if(fruity.length) extraPool=fruity;
    }
    // Granen combineren met fruit of noten
    if(pick.cat==="granen"){
      var fruitNoot=extraPool.filter(function(e){ return e.cat==="fruit"||e.cat==="noten"; });
      if(fruitNoot.length) extraPool=fruitNoot;
    }
    extra=extraPool[Math.floor(Math.random()*extraPool.length)];
  }

  // Totale macros combinatie
  var totaalKcal=portieKcal+(extra?extra.kcal:0);
  var totaalProt=portieProt+(extra?Math.round(extra.prot):0);

  // Beschrijving combinatie
  var basis=portie+"g "+pick.name+(pick.brand?" ("+pick.brand+")":"");
  var combinatie=extra?basis+" met "+extra.name:basis;

  // Bereidingstip
  var tip="";
  if(pick.cat==="zuivel"&&extra&&extra.cat==="fruit") tip="Schep de "+pick.name.toLowerCase()+" in een kom en leg het fruit er bovenop.";
  else if(pick.cat==="zuivel"&&extra&&extra.cat==="zaad") tip="Meng de "+pick.name.toLowerCase()+" en strooi het zaad er doorheen.";
  else if(pick.cat==="granen"&&extra&&extra.cat==="fruit") tip="Combineer de granen met het fruit voor extra smaak en vezels.";
  else if(pick.cat==="eiwit"&&extra&&extra.cat==="groente") tip="Serveer het vlees/vis met de groente als lichte maaltijd.";
  else if(extra&&extra.cat==="noten") tip="Eet de noten als crunch erbij — ook goed voor gezonde vetten.";
  else if(extra&&extra.cat==="smaak") tip="Voeg "+extra.name+" toe voor extra smaak zonder veel calorieën.";

  var fitMsg=goals.goal==="afvallen"?"Past bij afvallen: "+totaalKcal+" kcal en "+totaalProt+"g eiwit.":goals.goal==="spiermassa"?"Goed voor spiermassa: "+totaalProt+"g eiwit in deze combinatie.":"Evenwichtige snack: "+totaalKcal+" kcal · "+totaalProt+"g eiwit.";

  var slotLabel={ontbijt:"ontbijt",ochtendsnack:"ochtendsnack",lunch:"lunch",middagsnack:"middagsnack",avondeten:"avondeten",avondsnack:"avondsnack",nachtsnack:"late snack"}[slot];
  return {pick:pick,portie:portie,extra:extra,combinatie:combinatie,portieKcal:portieKcal,portieProt:portieProt,totaalKcal:totaalKcal,totaalProt:totaalProt,tip:tip,slotLabel:slotLabel,snackKcalBudget:snackKcalBudget,snackProteinTarget:snackProteinTarget,fitMsg:fitMsg,hour:hour,top:top};
}

function fileToBase64(file){
  return new Promise(function(resolve){ var r=new FileReader(); r.onload=function(e){ resolve(e.target.result); }; r.readAsDataURL(file); });
}
function compressImage(dataUrl,maxSize,quality){
  maxSize=maxSize||300; quality=quality||0.78;
  return new Promise(function(resolve){
    var img=new Image();
    img.onload=function(){
      var scale=Math.min(maxSize/img.width,maxSize/img.height,1);
      var c=document.createElement("canvas"); c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      resolve(c.toDataURL("image/jpeg",quality));
    };
    img.src=dataUrl;
  });
}

function mapOFFProduct(data){
  if(!data||data.status!==1||!data.product) return null;
  var p=data.product, n=p.nutriments||{};
  function num(v){ var x=parseFloat(v); return isNaN(x)?"":Math.round(x*10)/10; }
  function guessCat(p2){
    var cats=(p2.categories_tags||[]).join(" ").toLowerCase();
    var name=(p2.product_name||"").toLowerCase();
    var s=cats+" "+name;
    if(/yogh|yogurt|kvarg|kwark|melk|milk|cheese|ost|dairy|skyr/.test(s)) return "zuivel";
    if(/protein|meat|fish|egg|kj.tt|fisk|kylling|chicken|salmon/.test(s)) return "eiwit";
    if(/butter|margarin|mayo|spread|jam|peanut|sm.r|p.legg/.test(s)) return "broodbeleg";
    if(/veget|fruit|gr.nnsak/.test(s)) return "groenten";
    if(/bread|pasta|br.d/.test(s)) return "granen";
    return "overig";
  }
  var enumbers="";
  if(Array.isArray(p.additives_tags)) enumbers=p.additives_tags.map(function(t){ return t.replace(/^en:/,"").toUpperCase(); }).filter(function(c){ return /^E\d/.test(c); }).join(", ");
  return {name:p.product_name||p.product_name_nb||p.product_name_en||"",brand:(p.brands||"").split(",")[0].trim(),cat:guessCat(p),protein:num(n.proteins_100g),fat:num(n.fat_100g),carb:num(n.carbohydrates_100g),sugar:num(n.sugars_100g),kcal:n["energy-kcal_100g"]!=null?Math.round(n["energy-kcal_100g"]):"",enumbers:enumbers,note:p.quantity?"Verpakking: "+p.quantity:""};
}
async function lookupBarcode(code){
  var url="https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json";
  var res; try{ res=await fetch(url); }catch(e){ throw new Error("Geen internetverbinding"); }
  if(res.status===404) throw new Error("Niet gevonden in Open Food Facts — vul handmatig in");
  if(!res.ok) throw new Error("Database niet bereikbaar ("+res.status+")");
  var data; try{ data=await res.json(); }catch(e){ throw new Error("Antwoord onleesbaar"); }
  if(data.status===0||!data.product) throw new Error("Niet gevonden in Open Food Facts — vul handmatig in");
  var mapped=mapOFFProduct(data);
  if(!mapped) throw new Error("Niet gevonden in Open Food Facts — vul handmatig in");
  return mapped;
}

async function openBarcodeScanner(){
  setState({barcodeOpen:true,barcodeStatus:"Camera starten..."});
  setTimeout(async function(){
    if(typeof Html5Qrcode==="undefined"){ setState({barcodeStatus:"Scanner niet beschikbaar. Controleer je internetverbinding."}); return; }
    try{
      var scanner=new Html5Qrcode("barcode-reader"); scannerRef=scanner;
      setState({barcodeStatus:"Richt op de streepjescode..."});
      await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:150}},
        async function(code){ await stopBarcodeScanner(); setState({barcodeOpen:false,barcodeStatus:""}); await handleBarcodeResult(code); },
        function(){}
      );
    }catch(err){ setState({barcodeStatus:"Camera kon niet starten: "+(err.message||err)}); }
  },300);
}
async function stopBarcodeScanner(){
  if(scannerRef){ try{ await scannerRef.stop(); scannerRef.clear(); }catch(e){} scannerRef=null; }
}
async function closeBarcodeScanner(){ await stopBarcodeScanner(); setState({barcodeOpen:false,barcodeStatus:""}); }
async function handleBarcodeResult(code){
  setState({scanning:true,scanError:""});
  try{
    var result=await lookupBarcode(code);
    var form=Object.assign({},state.form);
    Object.keys(result).forEach(function(k){ if(result[k]!=="") form[k]=result[k]; });
    setState({form:form,scanDone:true,scanning:false});
  }catch(err){ setState({scanError:err.message||"Barcode niet herkend — vul handmatig in",scanning:false}); }
}

function addProduct(){
  var f=state.form;
  if(!f.name) return;
  var p={id:Date.now(),name:f.name,brand:f.brand||"",cat:f.cat||"overig",use:f.use||"",protein:parseFloat(f.protein)||0,fat:parseFloat(f.fat)||0,carb:parseFloat(f.carb)||0,sugar:parseFloat(f.sugar)||0,kcal:parseInt(f.kcal)||0,note:f.note||"",enumbers:f.enumbers||"",imgFront:state.imgFront||null,imgLabel:state.imgLabel||null,emoji:"🫙"};

function exportData(){
  try{
    var blob=new Blob([JSON.stringify({app:"ProteinCheck",version:2,exportedAt:new Date().toISOString(),products:state.products,goals:state.goals})],{type:"application/json"});
    var url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download="proteincheck-backup-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },1000);

}
function importData(e){
  var file=e.target&&e.target.files&&e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result);
      var prods=Array.isArray(data)?data:Array.isArray(data.products)?data.products:null;
      if(!prods){ setState({backupMsg:"Geen producten gevonden in dit bestand"}); return; }
      persist(prods);
      var importedGoals=data.goals?Object.assign({},DEFAULT_GOALS,data.goals):state.goals;
      if(data.goals) storage.set("proteincheck-goals",JSON.stringify(importedGoals));
      setState({products:prods,goals:importedGoals,backupMsg:"✓ "+prods.length+" producten geladen"});
    }catch(err){ setState({backupMsg:"Importeren mislukt: bestand onleesbaar"}); }
  };
  reader.readAsText(file); e.target.value="";
}

function h(tag,attrs,children){
  var el=document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    if(k==="style"&&typeof attrs[k]==="object"){ Object.assign(el.style,attrs[k]); }
    else if(k.startsWith("on")){ el.addEventListener(k.slice(2).toLowerCase(),attrs[k]); }
    else if(k==="className"){ el.className=attrs[k]; }
    else if(k==="htmlFor"){ el.htmlFor=attrs[k]; }
    else if(k==="checked"){ el.checked=attrs[k]; }
    else if(k==="disabled"){ if(attrs[k]) el.disabled=true; }
    else if(k==="value"&&(tag==="INPUT"||tag==="input"||tag==="SELECT"||tag==="select")){ el.value=attrs[k]!=null?attrs[k]:""; }
    else{ try{ el.setAttribute(k,attrs[k]); }catch(e){} }
  });
  if(children){
    if(!Array.isArray(children)) children=[children];
    children.forEach(function(c){
      if(c==null||c===false||c===undefined) return;
      if(typeof c==="string"||typeof c==="number"){ el.appendChild(document.createTextNode(c)); }
      else if(c instanceof Node){ el.appendChild(c); }
    });
  }
  return el;
}
function div(cls,children,extra){ return h("div",Object.assign({className:cls},extra),children); }
function btn(cls,txt,onClick){ return h("button",{className:cls,onClick:onClick},[txt]); }
function frag(children){
  var f=document.createDocumentFragment();
  if(!Array.isArray(children)) children=[children];
  children.forEach(function(c){ if(c instanceof Node) f.appendChild(c); });
  return f;
}

  panel.appendChild(macGrid);
  if(p.imgLabel){
    var lblWrap=h("div",{style:{marginBottom:"12px"}});
    var lblImg=h("img",{src:p.imgLabel,style:{width:"100%",maxHeight:"200px",objectFit:"contain",borderRadius:"8px",border:"1px solid #C8DCE8",display:"block",background:"#f9f9f9",cursor:"zoom-in"}});
    lblImg.addEventListener("click",function(){ setState({lightbox:p.imgLabel}); });
    lblWrap.appendChild(lblImg);
    panel.appendChild(lblWrap);
  }
  if(p.use) panel.appendChild(h("div",{style:{background:"#EAF4FB",borderRadius:"7px",padding:"8px 11px",fontSize:"12px",color:"#0A2A4A",marginBottom:"8px"}},["📍 "+p.use]));
  if(p.note) panel.appendChild(h("div",{style:{fontSize:"11px",color:"#5D7A8A",fontStyle:"italic",lineHeight:"1.5",marginBottom:"10px"}},["💬 "+p.note]));

  // E-nummers
  var ens=parseENumbers(p.enumbers||"");
  if(ens.length){
    var reds=ens.filter(function(e){ return e.rating==="red"; });
    var yellows=ens.filter(function(e){ return e.rating==="yellow"; });
    var summary=reds.length>0?{color:"#C0392B",icon:"🔴",text:reds.length+" toevoeging"+(reds.length>1?"en":"")+" om te vermijden"}:yellows.length>0?{color:"#D4A017",icon:"🟡",text:yellows.length+" toevoeging"+(yellows.length>1?"en":"")+" om te beperken"}:{color:"#2E8B57",icon:"🟢",text:"Alle toevoegingen veilig"};
    var eBlock=div("e-block");
    eBlock.style.border="1.5px solid "+summary.color;
    eBlock.style.background=summary.color+"0D";
    var sumRow=h("div",{style:{display:"flex",alignItems:"center",gap:"6px",marginBottom:"8px"}},[h("span",null,[summary.icon]),h("span",{style:{fontSize:"12px",fontWeight:"700",color:summary.color}},["E-nummers: "+summary.text])]);
    eBlock.appendChild(sumRow);
    ens.forEach(function(en){
      var row=div("e-row",[
        h("span",{className:"e-dot",style:{background:eColor(en.rating)}}),
        h("div",{style:{flex:"1"}},[
          div("e-name",[h("strong",{style:{color:eColor(en.rating)}},[en.code])," · "+en.name,h("span",{style:{color:eColor(en.rating),fontSize:"10px",fontWeight:"600",marginLeft:"6px"}},[eLabel(en.rating)])]),
          div("e-desc",[en.desc])
        ])
      ]);
      eBlock.appendChild(row);
    });
    panel.appendChild(eBlock);
  }

  // Advies
  if(advice.length){
    var advBox=div("advice-box");
    advBox.appendChild(div("advice-title",["💡 Persoonlijk advies"]));
    advice.forEach(function(line){
      var cls="advice-line"+(line.startsWith("⚠️")||line.startsWith("❌")||line.startsWith("🍬")?" advice-warn":line.startsWith("✅")||line.startsWith("👍")||line.startsWith("💪")?" advice-good":"");
      advBox.appendChild(div(cls,[line]));
    });
    panel.appendChild(advBox);
  }

  var btnRow=div("btn-group");
  btnRow.appendChild(h("button",{className:"btn btn-secondary",style:{flex:"1"},onClick:function(){ setState({detail:null,detailAdvice:[]}); }},["Sluiten"]));
  btnRow.appendChild(h("button",{className:"btn btn-mint",onClick:function(){ openEdit(p); }},["✏️"]));
  btnRow.appendChild(h("button",{className:"btn btn-danger",onClick:function(){ if(confirm("Product verwijderen?")) deleteProduct(p.id); }},["🗑"]));
  panel.appendChild(btnRow);
  return panel;
}

function renderSnackPanel(){
  var sr=state.snackResult;
  var panel=div("panel-bottom");
  if(sr.error){
    panel.appendChild(div("snack-title",["🍎 Snack suggestie"]));
    panel.appendChild(h("div",{style:{fontSize:"13px",color:"#5D7A8A",lineHeight:"1.6"}},[sr.error]));
    panel.appendChild(h("button",{className:"btn btn-secondary",style:{width:"100%",marginTop:"16px"},onClick:function(){ setState({snackOpen:false}); }},["Sluiten"]));
    return panel;
  }
  var p=sr.pick;

  // Header
  panel.appendChild(div("snack-timeslot",[
    div("snack-timeslot-label",["🕐 "+sr.slotLabel+" · "+sr.hour+":00 uur"]),
    h("button",{className:"snack-close",onClick:function(){ setState({snackOpen:false}); }},["✕"])
  ]));
  panel.appendChild(div("snack-title",["Snack suggestie"]));

  // Combinatie headline
  var combo=h("div",{style:{background:"#0A2A4A",borderRadius:"12px",padding:"14px 16px",marginBottom:"14px"}});
  combo.appendChild(h("div",{style:{fontSize:"11px",color:"#5DADE2",fontWeight:"600",textTransform:"uppercase",letterSpacing:"1px",marginBottom:"6px"}},["🍽️ Jouw combinatie"]));
  combo.appendChild(h("div",{style:{fontSize:"16px",fontWeight:"700",color:"#fff",lineHeight:"1.5"}},[sr.combinatie]));
  if(sr.tip) combo.appendChild(h("div",{style:{fontSize:"11px",color:"rgba(255,255,255,0.65)",marginTop:"6px",lineHeight:"1.5"}},[sr.tip]));
  panel.appendChild(combo);

  // Totaal macros
  var macroRow=h("div",{style:{display:"flex",gap:"8px",marginBottom:"14px"}});
  [["⚡ "+sr.totaalKcal+" kcal","Totaal"],["💪 "+sr.totaalProt+"g","Eiwit"],["🎯 "+sr.snackKcalBudget+" kcal","Budget"]].forEach(function(m){
    var cell=h("div",{style:{flex:"1",background:"#EBF5FB",borderRadius:"8px",padding:"8px 6px",textAlign:"center"}});
    cell.appendChild(h("div",{style:{fontSize:"13px",fontWeight:"700",color:"#0A2A4A"}},[m[0]]));
    cell.appendChild(h("div",{style:{fontSize:"9px",color:"#5D7A8A",marginTop:"2px"}},[m[1]]));
    macroRow.appendChild(cell);
  });
  panel.appendChild(macroRow);

  // Basis product kaartje
  var card=div("snack-card");
  if(p.imgFront) card.appendChild(h("img",{src:p.imgFront,className:"snack-card-img"}));
  var cardBody=div("snack-card-body");
  cardBody.appendChild(div("snack-card-cat",[CAT_LABELS[p.cat]||p.cat]));
  cardBody.appendChild(div("snack-card-name",[p.name]));
  if(p.brand) cardBody.appendChild(div("snack-card-brand",[p.brand]));
  var portieBox=div("snack-portie",[
    div("snack-portie-gram",[sr.portie+"g"]),
    h("div",null,[
      sr.portieProt!=null?div("snack-portie-prot",["→ "+sr.portieProt+"g eiwit"]):"",
      sr.portieKcal!=null?div("snack-portie-kcal",["→ "+sr.portieKcal+" kcal"]):"",
    ])
  ]);
  cardBody.appendChild(portieBox);

  // Aanvulling tonen
  if(sr.extra){
    var extraBox=h("div",{style:{background:"rgba(255,255,255,0.7)",borderRadius:"8px",padding:"8px 11px",display:"flex",alignItems:"center",gap:"8px"}});
    extraBox.appendChild(h("span",{style:{fontSize:"18px"}},["+"]) );
    extraBox.appendChild(h("div",null,[
      h("div",{style:{fontSize:"12px",fontWeight:"600",color:"#0A2A4A"}},[sr.extra.name]),
      h("div",{style:{fontSize:"10px",color:"#5D7A8A"}},["~"+sr.extra.kcal+" kcal · "+sr.extra.prot+"g eiwit"])
    ]));
    cardBody.appendChild(extraBox);
  }

  cardBody.appendChild(div("snack-reason",["💡 "+sr.fitMsg]));
  card.appendChild(cardBody);
  panel.appendChild(card);

  // Alternatieven
  var alts=sr.top.filter(function(a){ return a.id!==p.id; });
  if(alts.length){
    panel.appendChild(div("alt-title",["Andere basis uit je catalogus:"]));
    alts.forEach(function(alt){
      var item=div("alt-item");
      item.addEventListener("click",function(){ pickAlt(alt); });
      if(alt.imgFront) item.appendChild(h("img",{src:alt.imgFront,className:"alt-img"}));
      else item.appendChild(div("alt-emoji",[alt.emoji||"🫙"]));
      item.appendChild(h("div",null,[div("alt-name",[alt.name]),div("alt-sub",[alt.protein+"g eiwit/100g · Tik om te kiezen"])]));
      panel.appendChild(item);
    });
  }

  var btnRow=div("btn-group");
  btnRow.appendChild(h("button",{className:"btn btn-mint",style:{flex:"1"},onClick:doSnack},["🔄 Andere combinatie"]));
  btnRow.appendChild(h("button",{className:"btn btn-primary",style:{flex:"1"},onClick:function(){ setState({snackOpen:false}); }},["✓ Klaar"]));
  panel.appendChild(btnRow);
  return panel;
}

// ══════════════════════════════════════════════════════════════════
// MAIN RENDER
// ══════════════════════════════════════════════════════════════════
function render(){
  var app=document.getElementById("app");
  app.innerHTML="";
  var s=state;

  if(!s.loaded){
    app.appendChild(h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",color:"#5D7A8A",gap:"12px"}},["🌿","Catalogus laden..."]));
    return;
  }

  // ── BARCODE OVERLAY ──
  if(s.barcodeOpen){
    var bo=div("barcode-overlay");
    bo.appendChild(h("div",{style:{color:"#fff",fontSize:"16px",fontWeight:"700",marginBottom:"16px"}},["📷 Scan de streepjescode"]));
    bo.appendChild(h("div",{id:"barcode-reader"}));
    if(s.barcodeStatus) bo.appendChild(div("barcode-status",[s.barcodeStatus]));
    bo.appendChild(h("button",{className:"btn",style:{marginTop:"20px",padding:"11px 28px",border:"1.5px solid #fff",borderRadius:"10px",background:"transparent",color:"#fff"},onClick:closeBarcodeScanner},["Annuleren"]));
    app.appendChild(bo);
    return;
  }

  // ── LIGHTBOX ──
  if(s.lightbox){
    var lb=div("lightbox");
    lb.addEventListener("click",function(){ setState({lightbox:null}); });
    lb.appendChild(h("img",{src:s.lightbox}));
    lb.appendChild(div("lightbox-close",["✕"]));
    app.appendChild(lb);
  }

  // ── HEADER ──
  var header=div("header",[
    h("div",null,[
      div("header-title",["🌿 Mijn Voedselcatalogus"]),
      div("header-sub",["Eiwitten & E-nummers inzichtelijk"])
    ]),
    h("button",{className:"btn",style:{background:"rgba(255,255,255,.15)",border:"none",color:"#fff",fontSize:"12px"},onClick:function(){ setState({showGoals:true,goalsDraft:Object.assign({},s.goals)}); }},["⚙️ Doelen"])
  ]);
  app.appendChild(header);

  // ── STATS BAR ──
  var avgProt=s.products.length?(s.products.reduce(function(a,p){ return a+p.protein; },0)/s.products.length).toFixed(1):0;
  var topProt=s.products.length?s.products.slice().sort(function(a,b){ return b.protein-a.protein; })[0]:null;
  var sb=div("stats-bar");
  [
    [s.goals.proteinMin+"–"+s.goals.proteinMax+"g","Eiwitdoel/dag"],
    [s.goals.weight+"→"+s.goals.targetWeight+"kg","Gewicht / doel"],
    [avgProt+"g","Gem. eiwit/100g"],
    [topProt?topProt.name.split(" ").slice(0,2).join(" "):"-","⭐ Meest eiwit"]
  ].forEach(function(item,i){
    var stat=div("stat",[
      h("div",{className:"stat-num"+(i===3?" small":"")},[item[0]]),
      div("stat-lbl",[item[1]])
    ]);
    sb.appendChild(stat);
  });
  app.appendChild(sb);

  if(s.saveErr) app.appendChild(div("save-err",[s.saveErr]));

  // ── FILTER BAR ──
  var fb=div("filter-bar");
  [["all","Alles"],["zuivel","🥛 Zuivel"],["eiwit","💪 Eiwitbron"],["broodbeleg","🥪 Broodbeleg"],["groenten","🥦 Groenten"],["granen","🌾 Granen"],["overig","🫙 Overig"]].forEach(function(f){
    var b=h("button",{className:"filter-btn"+(s.filter===f[0]?" active":""),onClick:function(){ setState({filter:f[0]}); }},[f[1]]);
    fb.appendChild(b);
  });
  var searchInp=h("input",{id:"search-input",placeholder:"🔍 Zoeken...",value:s.search||""});
  searchInp.addEventListener("input",function(){ setState({search:searchInp.value}); });
  fb.appendChild(searchInp);
  app.appendChild(fb);

  // ── PRODUCT GRID ──
  var q=(s.search||"").toLowerCase();
  var filtered=s.products.filter(function(p){
    var matchCat=s.filter==="all"||p.cat===s.filter;
    return matchCat&&(!q||p.name.toLowerCase().indexOf(q)>=0||(p.brand||"").toLowerCase().indexOf(q)>=0);
  });
  var grid=div("grid");
  filtered.forEach(function(p){ grid.appendChild(renderProductCard(p)); });
  var addCard=div("add-card",["➕","Product toevoegen"]);
  addCard.addEventListener("click",function(){ setState({showAdd:true,form:{cat:"zuivel"},imgFront:null,imgLabel:null,scanDone:false,scanError:""}); });
  grid.appendChild(addCard);
  app.appendChild(grid);

  // ── FLOATING BUTTON met swipe ──
  var fab=h("button",{className:"fab",id:"fab-snack",title:"Stel snack voor",onClick:doSnack},["🍎"]);
  // Swipe-rechts om te verbergen, tik links van scherm om terug te halen
  var fabHidden=false, touchStartX=0;
  fab.addEventListener("touchstart",function(e){ touchStartX=e.touches[0].clientX; },{passive:true});
  fab.addEventListener("touchend",function(e){
    var dx=e.changedTouches[0].clientX-touchStartX;
    if(dx>40){ fab.classList.add("hidden"); fabHidden=true; }
  },{passive:true});
  // Tik op linkerrand scherm om fab terug te halen
  document.addEventListener("touchend",function(e){
    if(fabHidden&&e.changedTouches[0].clientX<40){
      fab.classList.remove("hidden"); fabHidden=false;
    }
  },{passive:true,once:false});
  app.appendChild(fab);

  // ── OVERLAYS ──
  function makeOverlay(panelEl,bottom){
    var ov=div(bottom?"overlay bottom":"overlay");
    ov.addEventListener("click",function(e){ if(e.target===ov) closeAll(); });
    ov.appendChild(panelEl);
    return ov;
  }
  function closeAll(){
    setState({showGoals:false,showAdd:false,showEdit:false,detail:null,detailAdvice:[],snackOpen:false});
  }

  if(s.showGoals) app.appendChild(makeOverlay(renderGoalsPanel(),false));
  if(s.showAdd)   app.appendChild(makeOverlay(renderAddPanel(),false));
  if(s.showEdit)  app.appendChild(makeOverlay(renderEditPanel(),false));
  if(s.detail)    app.appendChild(makeOverlay(renderDetailPanel(),false));
  if(s.snackOpen&&s.snackResult) app.appendChild(makeOverlay(renderSnackPanel(),true));
}

// ── BARCODE LIB (non-blocking) ──
(function(){
  var s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";
  document.head.appendChild(s);
})();

render();
</script>
