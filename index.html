function parseENumbers(str) {
  if (!str) return [];
  const matches = (str.toUpperCase().match(/E\s?\d{3}[A-Z]?/g)||[]).map(m=>m.replace(/\s/g,""));
  return [...new Set(matches)].map(code => {
    const info = E_NUMBERS[code];
    if (info) return { code, name:info[0], rating:info[1], desc:info[2] };
    return { code, name:"Onbekend", rating:"unknown", desc:"Niet in database" };
  });
}
function eRatingColor(r){ return r==="green"?"#2E8B57":r==="yellow"?"#D4A017":r==="red"?"#C0392B":"#999"; }
function eRatingLabel(r){ return r==="green"?"Veilig":r==="yellow"?"Matig":r==="red"?"Vermijden":"Onbekend"; }

function mapOFFProduct(data) {
  if (!data || data.status !== 1 || !data.product) return null;
  const p = data.product;
  const n = p.nutriments || {};
  const num = v => { const x=parseFloat(v); return isNaN(x)?"":Math.round(x*10)/10; };
  function guessCat(p2) {
    const cats=(p2.categories_tags||[]).join(" ").toLowerCase();
    const name=(p2.product_name||"").toLowerCase();
    const s=cats+" "+name;
    if(/yogh|yogurt|kvarg|kwark|melk|milk|cheese|ost|dairy|skyr/.test(s)) return "zuivel";
    if(/protein|meat|fish|egg|kjøtt|fisk|kylling|chicken|salmon/.test(s)) return "eiwit";
    if(/butter|margarin|mayo|spread|jam|peanut|smør|pålegg/.test(s)) return "broodbeleg";
    if(/veget|fruit|grønnsak/.test(s)) return "groenten";
    if(/bread|pasta|brød/.test(s)) return "granen";
    return "overig";
  }
  let enumbers = "";
  if (Array.isArray(p.additives_tags)) {
    enumbers = p.additives_tags.map(t=>t.replace(/^en:/,"").toUpperCase()).filter(c=>/^E\d/.test(c)).join(", ");
  }
  return {
    name: p.product_name||p.product_name_nb||p.product_name_en||"",
    brand: (p.brands||"").split(",")[0].trim(),
    cat: guessCat(p),
    protein: num(n.proteins_100g), fat: num(n.fat_100g),
    carb: num(n.carbohydrates_100g), sugar: num(n.sugars_100g),
    kcal: n["energy-kcal_100g"]!=null?Math.round(n["energy-kcal_100g"]):"",
    enumbers, note: p.quantity?"Verpakking: "+p.quantity:""
  };
}

async function lookupBarcode(code) {
  const url="https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json";
  let res;
  try { res = await fetch(url); } catch(e) { throw new Error("Geen internetverbinding — controleer je verbinding"); }
  if(res.status===404) throw new Error("Dit product staat (nog) niet in Open Food Facts — vul handmatig in");
  if(!res.ok) throw new Error("Database tijdelijk niet bereikbaar ("+res.status+") — probeer later opnieuw");
  let data;
  try { data = await res.json(); } catch(e) { throw new Error("Antwoord van database onleesbaar — probeer opnieuw"); }
  if(data.status===0||!data.product) throw new Error("Dit product staat (nog) niet in Open Food Facts — vul handmatig in");
  const mapped = mapOFFProduct(data);
  if(!mapped) throw new Error("Dit product staat (nog) niet in Open Food Facts — vul handmatig in");
  return mapped;
}

// DOELSTELLINGEN — uitgebreid met activiteit, doelgewicht, macro's
// ═══════════════════════════════════════════════════════════════
const DEFAULT_GOALS = {
  weight: 97,
  targetWeight: 85,
  proteinMin: 130,
  proteinMax: 140,
  proteinActive: 150,
  goal: "afvallen",
  mealsPerDay: 4,
  activityLevel: "matig",   // laag | matig | hoog
  kcalTarget: 2000,
  fatTarget: 65,
  carbTarget: 175,
};

// ═══════════════════════════════════════════════════════════════
// ADVIESMOTOR — volledig regel-gebaseerd, geen externe API
// ═══════════════════════════════════════════════════════════════
function generateAdvice(product, goals) {
  const lines = [];
  const p    = parseFloat(product.protein) || 0;
  const fat  = parseFloat(product.fat)     || 0;
  const carb = parseFloat(product.carb)    || 0;
  const sugar= parseFloat(product.sugar)   || 0;
  const kcal = parseFloat(product.kcal)    || 0;
  const cat  = product.cat || "overig";

  // ── 1. Effectief eiwitdoel op basis van activiteitsniveau ──
  const actFactor = goals.activityLevel==="hoog"?1.3 : goals.activityLevel==="matig"?1.15 : 1.0;
  const baseProtein = goals.goal==="spiermassa"
    ? goals.proteinActive
    : goals.goal==="onderhoud"
      ? goals.proteinMin
      : (goals.proteinMin + goals.proteinMax) / 2;
  const effectiveProtein = Math.round(baseProtein * actFactor);
  const proteinPerMeal   = Math.round(effectiveProtein / goals.mealsPerDay);
  const kcalPerMeal      = Math.round(goals.kcalTarget  / goals.mealsPerDay);

  // ── 2. Eiwitbeoordeling ──
  if      (p >= 20) lines.push("✅ Topeiwitbron ("+p+"g/100g) — uitstekend voor jouw doel.");
  else if (p >= 15) lines.push("✅ Uitstekende eiwitbron ("+p+"g/100g).");
  else if (p >= 7)  lines.push("👍 Goede eiwitbron ("+p+"g/100g).");
  else if (p >= 3)  lines.push("⚠️ Matige eiwitbron ("+p+"g/100g) — combineer met iets eiwitrijkers.");
  else              lines.push("❌ Weinig eiwit ("+p+"g/100g) — vul aan met een eiwitrijker product.");

  // ── 3. Portieadvies ──
  if (p > 0) {
    const portie = Math.round((proteinPerMeal / p) * 100);
    if (portie >= 30 && portie <= 700) {
      lines.push("📏 Aanbevolen portie: ~"+portie+"g → levert "+proteinPerMeal+"g eiwit (doel "+effectiveProtein+"g/dag ÷ "+goals.mealsPerDay+" maaltijden).");
      if (kcal > 0) {
        const portieKcal = Math.round((portie / 100) * kcal);
        const pct = Math.round((portieKcal / kcalPerMeal) * 100);
        lines.push("🔥 Die portie levert ~"+portieKcal+" kcal ("+pct+"% van je maaltijdbudget van "+kcalPerMeal+" kcal).");
      }
    }
  }

  // ── 4. Vetbeoordeling ──
  const fatPerMeal = Math.round(goals.fatTarget / goals.mealsPerDay);
  if (fat > 30) {
    lines.push("⚠️ Hoog vetgehalte ("+fat+"g/100g) — gebruik kleine porties; dagdoel is "+goals.fatTarget+"g vet.");
  } else if (fat > 20 && goals.goal === "afvallen") {
    lines.push("🟡 Redelijk vetgehalte ("+fat+"g/100g) — let op portiegrootte bij afvallen.");
  }

  // ── 5. Koolhydraten- en suikerwaarschuwing ──
  const carbPerMeal = Math.round(goals.carbTarget / goals.mealsPerDay);
  if (sugar > 15) {
    lines.push("🍬 Hoog suikergehalte ("+sugar+"g/100g) — beperkt gebruiken; past minder goed bij "+goals.goal+".");
  } else if (sugar > 8 && goals.goal === "afvallen") {
    lines.push("🟡 Matig suikergehalte ("+sugar+"g/100g) — let op frequentie.");
  }

  // ── 6. Categorie-timing ──
  const timing = {
    zuivel:     "🕐 Goed als ontbijt of tussendoor snack.",
    eiwit:      p>=15?"🍽️ Ideaal als hoofdgerecht of direct na het sporten.":"🍽️ Goed als onderdeel van een maaltijd.",
    broodbeleg: fat>20?"🥪 Gebruik als topping in kleine hoeveelheid, niet als basis.":"🥪 Prima als broodbeleg.",
    groenten:   "🥦 Caloriearm en voedzaam — combineer met een eiwitbron.",
    granen:     "🌾 Combineer altijd met een eiwitbron (doel "+carbPerMeal+"g koolh./maaltijd).",
    overig:     ""
  };
  if (timing[cat]) lines.push(timing[cat]);

  // ── 7. Doelgewicht-context ──
  const verschil = goals.weight - goals.targetWeight;
  if (goals.goal === "afvallen" && verschil > 0) {
    const past = p >= 7 && fat <= 20 && sugar <= 10;
    if (verschil > 15)
      lines.push("🎯 Nog "+verschil+"kg naar doelgewicht ("+goals.targetWeight+"kg) — "+(past?"dit product past goed in je plan.":"kies vaker producten met meer eiwit en minder vet."));
    else if (verschil >= 5)
      lines.push("🎯 Nog "+verschil+"kg naar doel — "+(past?"past prima in de afvalfase.":"let op vet- en suikergehalte."));
    else if (verschil > 0)
      lines.push("🎯 Bijna op doelgewicht ("+verschil+"kg te gaan) — focus op handhaven en voldoende eiwit.");
  } else if (goals.goal === "spiermassa") {
    lines.push(p>=15
      ?"💪 Goede keuze voor spiermassa-opbouw — hoog eiwit ondersteunt spierherstel."
      :"💪 Voor spiermassa: combineer met een product van >15g eiwit/100g.");
  } else if (goals.goal === "onderhoud") {
    lines.push("⚖️ Voor onderhoud: zorg dat je dagelijkse totaal rond "+effectiveProtein+"g eiwit blijft.");
  }

  // ── 8. Activiteitsniveau-tip ──
  if (goals.activityLevel === "hoog" && p < 10) {
    lines.push("🏃 Bij intensief sporten heb je extra eiwit nodig — kies vaker producten boven 15g/100g.");
  } else if (goals.activityLevel === "laag" && p >= 15) {
    lines.push("🪑 Bij een laag activiteitsniveau is dit een efficiënte eiwitkeuze met beperkte calorieën.");
  }

  return lines.join("\n");
}

async function compressImage(dataUrl,maxSize=300,quality=0.78) {
  try {
    const blob=await(await fetch(dataUrl)).blob();
    const bitmap=await createImageBitmap(blob,{imageOrientation:"from-image"});
    const scale=Math.min(maxSize/bitmap.width,maxSize/bitmap.height,1);
    const c=document.createElement("canvas"); c.width=Math.round(bitmap.width*scale); c.height=Math.round(bitmap.height*scale);
    c.getContext("2d").drawImage(bitmap,0,0,c.width,c.height); bitmap.close&&bitmap.close(); return c.toDataURL("image/jpeg",quality);
  } catch(e) {
    return new Promise(resolve=>{
      const img=new Image(); img.onload=()=>{
        const scale=Math.min(maxSize/img.width,maxSize/img.height,1);
        const c=document.createElement("canvas"); c.width=img.width*scale; c.height=img.height*scale;
        c.getContext("2d").drawImage(img,0,0,c.width,c.height); resolve(c.toDataURL("image/jpeg",quality));
      }; img.src=dataUrl;
    });
  }
}

function fileToBase64(file) {
  return new Promise(resolve=>{ const r=new FileReader(); r.onload=e=>resolve(e.target.result); r.readAsDataURL(file); });
}

  function generateSnack() {
    if (!products.length) {
      setSnackResult({ error: "Voeg eerst producten toe aan je catalogus." });
      setSnackOpen(true); return;
    }
    const hour = new Date().getHours();

    // Tijdslot bepalen
    const slot =
      hour >= 6  && hour < 10 ? "ontbijt"     :
      hour >= 10 && hour < 12 ? "ochtendsnack" :
      hour >= 12 && hour < 14 ? "lunch"        :
      hour >= 14 && hour < 17 ? "middagsnack"  :
      hour >= 17 && hour < 20 ? "avondeten"    :
      hour >= 20 && hour < 23 ? "avondsnack"   :
                                "nachtsnack";

    // Welke categorieën passen bij het moment?
    const catPref = {
      ontbijt:      ["zuivel","granen","eiwit"],
      ochtendsnack: ["zuivel","eiwit","groenten"],
      lunch:        ["eiwit","groenten","granen","broodbeleg"],
      middagsnack:  ["zuivel","eiwit","groenten"],
      avondeten:    ["eiwit","groenten","granen"],
      avondsnack:   ["zuivel","eiwit"],
      nachtsnack:   ["zuivel","eiwit"],
    }[slot] || ["eiwit","zuivel"];

    // Resterende macrospace op dit moment van de dag
    // Simpele schatting: hoeveel maaltijden zijn er al geweest?
    const mealsElapsed = Math.min(goals.mealsPerDay,
      hour < 8  ? 0 :
      hour < 12 ? 1 :
      hour < 15 ? 2 :
      hour < 19 ? 3 : goals.mealsPerDay - 1
    );
    const mealsLeft = Math.max(1, goals.mealsPerDay - mealsElapsed);
    const actFactor = goals.activityLevel==="hoog"?1.3 : goals.activityLevel==="matig"?1.15 : 1.0;
    const effectiveProtein = Math.round(((goals.proteinMin+goals.proteinMax)/2) * actFactor);
    const proteinLeft  = Math.round(effectiveProtein * (mealsLeft / goals.mealsPerDay));
    const kcalLeft     = Math.round(goals.kcalTarget  * (mealsLeft / goals.mealsPerDay));
    const fatLeft      = Math.round(goals.fatTarget   * (mealsLeft / goals.mealsPerDay));

    // Snackportie: voor een echte snack ~ 1 maaltijd / 1.5
    const snackProteinTarget = Math.round(proteinLeft / Math.max(1, mealsLeft));
    const snackKcalBudget    = Math.round(kcalLeft    / Math.max(1, mealsLeft));
    const snackFatBudget     = Math.round(fatLeft     / Math.max(1, mealsLeft));

    // Score elk product
    const scored = products.map(p => {
      const prot  = parseFloat(p.protein)||0;
      const fat   = parseFloat(p.fat)||0;
      const sugar = parseFloat(p.sugar)||0;
      const kcal  = parseFloat(p.kcal)||0;
      let score = 0;

      // Categorie voorkeur voor dit tijdstip
      const catRank = catPref.indexOf(p.cat);
      if      (catRank === 0) score += 40;
      else if (catRank === 1) score += 25;
      else if (catRank === 2) score += 10;

      // Eiwit dichtheid
      if      (prot >= 20) score += 35;
      else if (prot >= 15) score += 25;
      else if (prot >= 7)  score += 12;
      else if (prot >= 3)  score += 4;

      // Afstemming op doel
      if (goals.goal === "afvallen") {
        if (fat   > 25) score -= 20;
        if (sugar > 12) score -= 15;
        if (kcal  > 0 && kcal < 200) score += 10; // laagcalorisch bonus
      } else if (goals.goal === "spiermassa") {
        if (prot >= 15) score += 15;
        if (kcal  > 200) score += 5; // calorie-dense is ok
      }

      // E-nummers straf
      const ens = (p.enumbers||"").toUpperCase().match(/E\s?\d{3}[A-Z]?/g)||[];
      const redCount = ens.filter(e => {
        const code = e.replace(/\s/g,"");
        return ["E102","E104","E110","E122","E124","E127","E129","E131","E133",
                "E171","E220","E221","E249","E250","E251","E252","E320","E321",
                "E621","E622","E627","E631","E951","E952"].includes(code);
      }).length;
      score -= redCount * 8;

      // Avondsnack: voorkeur voor licht verteerbaar
      if ((slot==="avondsnack"||slot==="nachtsnack") && kcal > 300) score -= 10;

      return { ...p, _score: score };
    });

    // Sorteer, pak top-3 en kies willekeurig uit de top
    scored.sort((a,b) => b._score - a._score);
    const top = scored.slice(0, Math.min(3, scored.length));
    const pick = top[Math.floor(Math.random() * top.length)];

    // Bereken portie
    const prot = parseFloat(pick.protein)||0;
    let portie = prot > 0
      ? Math.round((snackProteinTarget / prot) * 100)
      : 100;
    portie = Math.max(30, Math.min(500, portie));

    const portieKcal = pick.kcal > 0 ? Math.round((portie/100)*pick.kcal) : null;
    const portieProt = prot > 0       ? Math.round((portie/100)*prot)      : null;

    // Contextzin
    const slotLabel = {
      ontbijt:"ontbijt", ochtendsnack:"ochtendsnack", lunch:"lunch",
      middagsnack:"middagsnack", avondeten:"avondeten",
      avondsnack:"avondsnack", nachtsnack:"late snack"
    }[slot];

    const fitMsg = goals.goal==="afvallen"
      ? `Past bij afvallen: beperkt in calorieën en levert goed eiwit.`
      : goals.goal==="spiermassa"
      ? `Goed voor spiermassa: hoog eiwit ondersteunt spierherstel.`
      : `Goede keuze voor onderhoud: evenwichtige macro's.`;

    setSnackResult({ pick, portie, portieKcal, portieProt, slotLabel, snackKcalBudget, snackProteinTarget, fitMsg, hour, top });
    setSnackOpen(true);
  }
