function parseENumbers(str) {
  if (!str) return [];
  const matches = (str.toUpperCase().match(/E\s?\d{3}[A-Z]?/g) || []).map((m) => m.replace(/\s/g, ""));
  const unique = [...new Set(matches)];
  return unique.map((code) => {
    const info = E_NUMBERS[code];
    if (info) return { code, name: info[0], rating: info[1], desc: info[2] };
    return { code, name: "Onbekend", rating: "unknown", desc: "Niet in database" };
  });
}
function eRatingColor(rating) {
  if (rating === "green") return "#2E8B57";
  if (rating === "yellow") return "#D4A017";
  if (rating === "red") return "#C0392B";
  return "#999";
}
function eRatingLabel(rating) {
  if (rating === "green") return "Veilig";
  if (rating === "yellow") return "Matig";
  if (rating === "red") return "Vermijden";
  return "Onbekend";
}
function mapOFFProduct(data) {
  if (!data || data.status !== 1 || !data.product) return null;
  const p = data.product;
  const n = p.nutriments || {};
  const num = (v) => {
    const x = parseFloat(v);
    return isNaN(x) ? "" : Math.round(x * 10) / 10;
  };
  function guessCat(p2) {
    const cats = (p2.categories_tags || []).join(" ").toLowerCase();
    const name = (p2.product_name || "").toLowerCase();
    const s = cats + " " + name;
    if (/yogh|yogurt|kvarg|kwark|melk|milk|cheese|ost|dairy|skyr/.test(s)) return "zuivel";
    if (/protein|meat|fish|egg|kj\u00f8tt|fisk|kylling|chicken|salmon/.test(s)) return "eiwit";
    if (/butter|margarin|mayo|spread|jam|peanut|sm\u00f8r|p\u00e5legg/.test(s)) return "broodbeleg";
    if (/veget|fruit|gr\u00f8nnsak/.test(s)) return "groenten";
    if (/bread|pasta|br\u00f8d/.test(s)) return "granen";
    return "overig";
  }
  let enumbers = "";
  if (Array.isArray(p.additives_tags)) {
    enumbers = p.additives_tags.map((t) => t.replace(/^en:/, "").toUpperCase()).filter((c) => /^E\d/.test(c)).join(", ");
  }
  return {
    name: p.product_name || p.product_name_nb || p.product_name_en || "",
    brand: (p.brands || "").split(",")[0].trim(),
    cat: guessCat(p),
    protein: num(n.proteins_100g),
    fat: num(n.fat_100g),
    carb: num(n.carbohydrates_100g),
    sugar: num(n.sugars_100g),
    kcal: n["energy-kcal_100g"] != null ? Math.round(n["energy-kcal_100g"]) : "",
    enumbers,
    note: p.quantity ? "Verpakking: " + p.quantity : ""
  };
}
async function lookupBarcode(code) {
  const url = "https://world.openfoodfacts.org/api/v2/product/" + encodeURIComponent(code) + ".json";
  const res = await fetch(url);
  if (!res.ok) throw new Error("Database niet bereikbaar (" + res.status + ")");
  const data = await res.json();
  const mapped = mapOFFProduct(data);
  if (!mapped) throw new Error("Product niet gevonden in Open Food Facts");
  return mapped;
}

async function compressImage(dataUrl, maxSize = 300, quality = 0.78) {
  try {
    const blob = await (await fetch(dataUrl)).blob();
    const bitmap = await createImageBitmap(blob, { imageOrientation: "from-image" });
    const scale = Math.min(maxSize / bitmap.width, maxSize / bitmap.height, 1);
    const c = document.createElement("canvas");
    c.width = Math.round(bitmap.width * scale);
    c.height = Math.round(bitmap.height * scale);
    c.getContext("2d").drawImage(bitmap, 0, 0, c.width, c.height);
    bitmap.close && bitmap.close();
    return c.toDataURL("image/jpeg", quality);
  } catch (e) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(maxSize / img.width, maxSize / img.height, 1);
        const c = document.createElement("canvas");
        c.width = img.width * scale;
        c.height = img.height * scale;
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      img.src = dataUrl;
    });
  }
}
function fileToBase64(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.readAsDataURL(file);
  });
}

function cropToBox(dataUrl, box) {
  return new Promise(async (resolve) => {
    let img;
    try {
      const blob = await (await fetch(dataUrl)).blob();
      img = await createImageBitmap(blob, { imageOrientation: "from-image" });
    } catch (e) {
      img = await new Promise((r) => {
        const i = new Image();
        i.onload = () => r(i);
        i.src = dataUrl;
      });
    }
    {
      const W = img.width, H = img.height;
      let x1 = Math.max(0, Math.min(1, box.x1 ?? 0));
      let y1 = Math.max(0, Math.min(1, box.y1 ?? 0));
      let x2 = Math.max(0, Math.min(1, box.x2 ?? 1));
      let y2 = Math.max(0, Math.min(1, box.y2 ?? 1));
      if (x2 < x1) {
        const t = x1;
        x1 = x2;
        x2 = t;
      }
      if (y2 < y1) {
        const t = y1;
        y1 = y2;
        y2 = t;
      }
      x1 = Math.max(0, x1 - 0.04);
      y1 = Math.max(0, y1 - 0.04);
      x2 = Math.min(1, x2 + 0.04);
      y2 = Math.min(1, y2 + 0.04);
      const cw = Math.floor((x2 - x1) * W);
      const ch = Math.floor((y2 - y1) * H);
      if (cw < W * 0.15 || ch < H * 0.08) {
        const fc = document.createElement("canvas");
        fc.width = W;
        fc.height = H;
        fc.getContext("2d").drawImage(img, 0, 0);
        resolve(fc.toDataURL("image/jpeg", 0.85));
        return;
      }
      const cx = Math.floor(x1 * W), cy = Math.floor(y1 * H);
      const canvas = document.createElement("canvas");
      canvas.width = cw;
      canvas.height = ch;
      canvas.getContext("2d").drawImage(img, cx, cy, cw, ch, 0, 0, cw, ch);
      resolve(canvas.toDataURL("image/jpeg", 0.9));
    }
  });
}
function extractJSON(text) {

(function waitReact(tries){
  if (typeof React !== "undefined" && typeof ReactDOM !== "undefined") { startApp(); }
  else if (tries > 0) { setTimeout(function(){ waitReact(tries-1); }, 100); }
  else {
    var errs = window.__loadErrors && window.__loadErrors.length ? "\n\nMislukt: " + window.__loadErrors.join(", ") : "";
    showError("React laadt niet. Controleer je internetverbinding en herlaad de pagina." + errs);
  }
})(50);
</script>
</body>
</html>
